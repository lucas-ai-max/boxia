<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>BoxIA — Wireframes Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@400;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #EDEAE0; font-family: 'Kalam', cursive; }
  * { box-sizing: border-box; }
  /* paper texture (subtle) */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0, transparent 40%);
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wireframe-screens.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showAlts": true,
  "showLegend": true,
  "accent": "orange"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <React.Fragment>
      <DesignCanvas
        title="BoxIA — Wireframes Mobile"
        subtitle="PRD v1.0 · 10 telas + 3 variações · low-fi sketch"
        background="#EDEAE0"
      >
        <DCSection id="flow-core" title="Fluxo principal — happy path">
          <DCArtboard id="legend" label="capa + legenda" width={320} height={520}>
            <Legend />
          </DCArtboard>
          <DCArtboard id="welcome" label="① boas-vindas" width={320} height={640}>
            <Welcome />
          </DCArtboard>
          <DCArtboard id="brand-dna" label="② DNA da marca" width={320} height={640}>
            <BrandDNA />
          </DCArtboard>
          <DCArtboard id="home" label="③ home" width={320} height={640}>
            <Home />
          </DCArtboard>
          <DCArtboard id="new-session" label="④ nova sessão" width={320} height={640}>
            <NewSession />
          </DCArtboard>
          <DCArtboard id="processing" label="⑤ processando" width={320} height={640}>
            <Processing />
          </DCArtboard>
          <DCArtboard id="results" label="⑥ resultado" width={320} height={640}>
            <ResultsList />
          </DCArtboard>
          <DCArtboard id="reply" label="⑦ resposta" width={320} height={640}>
            <ReplyDetail />
          </DCArtboard>
        </DCSection>

        <DCSection id="rag-flow" title="Biblioteca de respostas (RAG histórico)">
          <DCArtboard id="library" label="⑧ biblioteca" width={320} height={640}>
            <Library />
          </DCArtboard>
          <DCArtboard id="add-historical" label="⑨ importar prints" width={320} height={640}>
            <AddHistorical />
          </DCArtboard>
          <DCArtboard id="metrics" label="⑩ métricas" width={320} height={640}>
            <Metrics />
          </DCArtboard>
        </DCSection>

        {tweaks.showAlts && (
          <DCSection id="alt-explorations" title="Variações — direções alternativas">
            <DCArtboard id="alt-home" label="③·A home 'feed'" width={320} height={640}>
              <HomeAltA />
            </DCArtboard>
            <DCArtboard id="alt-results" label="⑥·A resultado por categoria" width={320} height={640}>
              <ResultsAltA />
            </DCArtboard>
            <DCArtboard id="alt-reply" label="⑦·A sugestões empilhadas" width={320} height={640}>
              <ReplyAltA />
            </DCArtboard>
          </DCSection>
        )}
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Conteúdo">
          <TweakToggle
            label="Mostrar variações alt"
            value={tweaks.showAlts}
            onChange={(v) => setTweak('showAlts', v)}
          />
        </TweakSection>
        <TweakSection title="Sobre">
          <div style={{ fontSize: 12, color: '#666', lineHeight: 1.4, fontFamily: 'system-ui' }}>
            Wireframes em estilo sketch para validar estrutura e
            fluxo. Tipografia, cores e ilustrações finais ainda
            não foram definidas — esse é o próximo passo.
          </div>
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
